# Avelis 演示环境。只用于本地开发与验收，端口只绑 127.0.0.1。通过 scripts/demo.py 起停。
#
#   meta-pg               Avelis 自己的元数据库（PostgreSQL；含 LangGraph 智能体状态）
#   valkey                Redis 协议兼容：任务队列、缓存、采集锁
#   shop-mysql            模拟业务方的电商维表库（客户、商品、类目、区域）
#   starrocks             演示数仓：电商事实表，并以外部表方式读取 shop-mysql 的维表
#   shop-pg               模拟业务方的线下门店库（PostgreSQL），用于验证第二种引擎的采集、血缘与问数
#
# 以下服务属于 engines 配置（profile），用于更多引擎的真实联调：scripts/demo.py up --engines 时才启动。
#   shop-ch               线下门店库（ClickHouse），与 shop-pg 同一份数据
#   shop-mssql            线下门店库（SQL Server 2022 Developer；用户已确认接受其许可条款，2026-10-29）
#   shop-oracle           线下门店库（Oracle Database 23ai Free；用户已确认接受其许可条款，2026-10-29）
#   shop-doris            线下门店库（Apache Doris 4.1 all-in-one：一个 FE + 一个 BE；不挂数据卷，启动后由 demo.py 灌数）
name: avelis-demo

services:
  meta-pg:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: avelis
      POSTGRES_USER: avelis
      POSTGRES_PASSWORD: ${AVELIS_PG_PASSWORD:?run scripts/demo.py init-env}
    ports:
      - "127.0.0.1:${AVELIS_PG_PORT:-15432}:5432"
    volumes:
      - meta-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avelis -d avelis"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    command: ["valkey-server", "--requirepass", "${AVELIS_REDIS_PASSWORD:?run scripts/demo.py init-env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${AVELIS_REDIS_PORT:-16379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${AVELIS_REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      AVELIS_REDIS_PASSWORD: ${AVELIS_REDIS_PASSWORD}

  shop-mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_ROOT_PASSWORD: ${SHOP_MYSQL_ROOT_PASSWORD:?run scripts/demo.py init-env}
      MYSQL_DATABASE: shop_dim
      SHOP_MYSQL_COLLECTOR_PASSWORD: ${SHOP_MYSQL_COLLECTOR_PASSWORD:?run scripts/demo.py init-env}
      SHOP_MYSQL_CATALOG_PASSWORD: ${SHOP_MYSQL_CATALOG_PASSWORD:?run scripts/demo.py init-env}
      SHOP_MYSQL_LEGACY_PASSWORD: ${SHOP_MYSQL_LEGACY_PASSWORD:?run scripts/demo.py init-env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Only for StarRocks' legacy ENGINE=mysql external tables (see init/02-users.sh).
      - --mysql-native-password=ON
    ports:
      - "127.0.0.1:${SHOP_MYSQL_PORT:-13306}:3306"
    volumes:
      - shop-mysql-data:/var/lib/mysql
      - ./shop-mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 60

  shop-pg:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: storedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SHOP_PG_PASSWORD:?run scripts/demo.py init-env}
      SHOP_PG_COLLECTOR_PASSWORD: ${SHOP_PG_COLLECTOR_PASSWORD:?run scripts/demo.py init-env}
      SHOP_PG_READER_PASSWORD: ${SHOP_PG_READER_PASSWORD:?run scripts/demo.py init-env}
    ports:
      - "127.0.0.1:${SHOP_PG_PORT:-15433}:5432"
    volumes:
      - shop-pg-data:/var/lib/postgresql
      - ./shop-pg/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storedb"]
      interval: 5s
      timeout: 3s
      retries: 30

  shop-ch:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    profiles: ["engines"]
    environment:
      CLICKHOUSE_PASSWORD: ${SHOP_CH_PASSWORD:?run scripts/demo.py init-env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${SHOP_CH_HTTP_PORT:-18123}:8123"
    volumes:
      - shop-ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  shop-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    profiles: ["engines"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SHOP_MSSQL_SA_PASSWORD:?run scripts/demo.py init-env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:${SHOP_MSSQL_PORT:-11433}:1433"
    volumes:
      - shop-mssql-data:/var/opt/mssql
    mem_limit: 3g

  shop-oracle:
    image: gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
    profiles: ["engines"]
    environment:
      ORACLE_PASSWORD: ${SHOP_ORACLE_SYSTEM_PASSWORD:?run scripts/demo.py init-env}
    ports:
      - "127.0.0.1:${SHOP_ORACLE_PORT:-11521}:1521"
    volumes:
      - shop-oracle-data:/opt/oracle/oradata
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

  shop-doris:
    image: apache/doris:all-in-one-4.1.3@sha256:82a5cabc7900ebcd3d080412d636c0cebd6602799fffe2605c652b2ea7d42609
    profiles: ["engines"]
    environment:
      FE_HEAP: 1024m
    ports:
      - "127.0.0.1:${SHOP_DORIS_QUERY_PORT:-19130}:9030"
      - "127.0.0.1:${SHOP_DORIS_HTTP_PORT:-18130}:8030"
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "/opt/doris-ci/health_check.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

  starrocks:
    image: starrocks/allin1-ubuntu:3.5.14@sha256:5e1fa9c1a490f49457b8220b10ef2ea211af271b2626654ba151429f4603715f
    entrypoint: ["/bin/bash", "/opt/avelis/avelis-entrypoint.sh"]
    environment:
      AVELIS_SR_FE_HEAP_MB: ${AVELIS_SR_FE_HEAP_MB:-1024}
      AVELIS_SR_BE_MEM_MB: ${AVELIS_SR_BE_MEM_MB:-3072}
      AVELIS_SR_ROOT_PASSWORD: ${SR_ROOT_PASSWORD:?run scripts/demo.py init-env}
    ports:
      - "127.0.0.1:${SR_QUERY_PORT:-19030}:9030"
      - "127.0.0.1:${SR_HTTP_PORT:-18030}:8030"
    volumes:
      - sr-fe-meta:/data/deploy/starrocks/fe/meta
      - sr-be-storage:/data/deploy/starrocks/be/storage
      - ./starrocks/avelis-entrypoint.sh:/opt/avelis/avelis-entrypoint.sh:ro
      - ./drivers:/opt/avelis/drivers:ro
    mem_limit: 5376m
    memswap_limit: 5376m
    cpus: 2.5
    depends_on:
      shop-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8030/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60

networks:
  default:
    # An explicit subnet: on hosts with many Compose projects the default
    # address pools can be exhausted ("all predefined address pools have been
    # fully subnetted"). Override AVELIS_DEMO_SUBNET if it overlaps your LAN.
    ipam:
      config:
        - subnet: ${AVELIS_DEMO_SUBNET:-10.240.17.0/24}

volumes:
  meta-pg-data:
  valkey-data:
  shop-mysql-data:
  shop-pg-data:
  shop-ch-data:
  shop-mssql-data:
  shop-oracle-data:
  sr-fe-meta:
  sr-be-storage:
