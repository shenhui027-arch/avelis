[project]
name = "avelis-dev"
version = "0.1.0"
description = "Avelis 开发与演示环境工具（演示库起停、灌数、StarRocks 实机核验）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymysql==1.2.3",
    "cryptography==50.0.2",
    "sqlglot==30.25.0",
    "psycopg[binary]==3.3.6",
    "clickhouse-connect==1.11.0",
    "pymssql==2.4.6",
    "oracledb==26.1.0",
]

[tool.uv]
package = false

# 仓库根目录的脚本沿用后端的检查规则（ruff 从文件所在目录向上找配置，backend/ 下以 backend/pyproject.toml 为准）
[tool.ruff]
required-version = ">=0.17"
line-length = 120
extend-exclude = ["backend", "frontend"]
# 让导入排序把 avelis、tests 与脚本模块识别为本仓库的模块
src = ["backend/src", "backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
