# 冻结规则：E1 运行前若需改动本文件的任何 B0 字段，先升版本号并写明原因，不在运行中途改；不为差结果加预算、改评分规则。

manifest_version: 1
frozen_at: 2026-10-31
authorization:
  real_model_calls: E0 与 E1  # 用户批准，经协调会话 local_305ac1bd 转达（2026-10-31）
  amount_cap_cny: 30  # E0 + E1 合计，达到即停止，不得超出
  date: 2026-10-31
  scope: E0 协议冒烟（≤12 次小请求，无业务数据）；E1 ≤48 次运行（6 场景 × D0–D3 × 2）；E1 须在 E0 结果回报并获确认后运行
  model: .env 现有的 DeepSeek Flash 指派（只读取，不打印密钥）
  pricing:  # https://api-docs.deepseek.com/zh-cn/quick_start/pricing，2026-10-31 读取；元 / 百万 token
    model: deepseek-flash（DeepSeek-V4.1-Flash-1017）
    peak: {cache_hit_input: 0.04, cache_miss_input: 2, output: 8}
    off_peak: {cache_hit_input: 0.02, cache_miss_input: 1, output: 4}
    peak_hours: 北京时间周一至周五（法定节假日除外）9:00–12:00、14:00–18:00；其余为空闲时段
    reasoning_tokens: 页面未说明；按已包含在 completion_tokens 中计（不重复计费）
  spent:
    e0: {requests: 8, cache_miss_input: 1432, cache_hit_input: 640, output: 346, period: off_peak, cny: "0.0028"}
    e1: {cny: "0", note: 待 E0 结果审查确认后运行；运行时以 --spent 0.0028 起算}
  retry_rule: 真实网络故障按流程规则只重试一次，计入请求数与费用上限；不为结果不好增加预算、重试或运行次数
  reference: 任务书《分析智能体优化与对照实验》第 2、12、13 节

