  locks_sha256:
    backend/uv.lock: 84d0ade2f51dc38c241d61d4205742ec06e5113e9a561ad5590281012145b828
    uv.lock: 6bcba8133dd9cd11085ca6d845d87648b90c6f280bab33a43d7adfd39e525174
    frontend/pnpm-lock.yaml: 497cd7ed3bf4b86276765ce4319afbd2978ff8d81f2caddc3e6950ab85462950
  key_libraries: {langchain-openai: 1.7.1, langchain-core: 1.6.11, langgraph: 1.2.15, sqlglot: 30.25.0}
  model:
    configured_by: bootstrap.model_from_env（提供方 preset=custom，code=env-default）
    model_id: deepseek-flash  # .env 的 AVELIS_MODEL_NAME；“实际返回的 ID/版本”历史运行没有记录（model_adapter 只记指派）
    endpoint_class: DeepSeek 官方 OpenAI 兼容接口（https://api.deepseek.com，Chat Completions）
    client: langchain_openai.ChatOpenAI（官方 OpenAI 规范实现，不解析也不回传 reasoning_content）
    reasoning_effort:
      analysis_assignment_default: low  # modelcfg.DEFAULT_EFFORT；DeepSeek 档位 off/low/high/max
      understand: off  # 发送 extra_body.thinking.type=disabled
      reason: low  # 发送 reasoning_effort=low（思考开启）
    request_params:
      temperature: 0.2  # service.require_analysis_model；思考开启时提供方忽略（官方文档：思考模式不支持 temperature）
      understand: {max_tokens: 1000, tool_choice: submit_scope, tools: [submit_scope]}
      reason: {max_tokens: null, tool_choice: null（auto）, tools: 工具箱全部工具（是否含 query_sql/sample_values 取决于数据源是否开启探索）}
      timeout_seconds: min(60, 统一截止时间剩余秒数)，不少于 1
      max_retries: 剩余时间 > 120 秒时 1（openai 客户端内部重试，不计入任何预算、不记步骤），否则 0
      streaming: false
    protocol_gaps_found:  # 第 4 节修复 E 的依据
      - reasoning_content 不往返：官方文档要求“携带了 tools 参数的请求，在后续所有请求中，必须完整回传 reasoning_content”，否则 400；
        ChatOpenAI 丢弃该字段。modelcfg.py 的注释以“实测没报 400”为据，不符合官方协议
      - finish_reason=length（输出截断）未检测，截断的工具参数按普通内容错误处理
      - 客户端内部重试不计入预算
  prompts_sha256:  # fingerprint.py：SYSTEM_PROMPT 模板（未填示例）、UNDERSTAND_PROMPT、占位示例填充后的系统提示
