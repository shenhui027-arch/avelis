[project]
name = "avelis"
version = "0.1.0"
description = "Avelis 后端：采集、血缘、粒度、口径治理、变更复核与受约束问数"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "pymysql==1.2.3",
    "cryptography==50.0.2",
    "sqlglot",
    "redis==8.1.0",
    "pyjwt==2.15.1",
    "httpx==0.28.1",
    "pwdlib[argon2]==0.3.1",
    "python-multipart==0.0.32",
    "langgraph==1.2.15",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg-pool==3.3.1",
    "langchain-core==1.6.11",
    "langchain-anthropic==1.7.6",
    "langchain-openai==1.7.1",
    "pymssql>=2.3",
    "clickhouse-connect>=0.8",
    "oracledb>=3.3",
    "reportlab>=4.2",
    "json-repair>=0.50",
    "impyla>=0.24",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv.sources]
# fork 分支 avelis-v30.27.0：v30.27.0 + Hive UNIONTYPE（上游 tobymao/sqlglot#8861）+ MySQL RENAME TABLE（上游 PR 待提交）；都合并发布后切回 PyPI 并删掉这里
sqlglot = { git = "https://github.com/shenhui027-arch/sqlglot", rev = "8614b60bf11925e1c5f29fd61f3a552a02fc4976" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avelis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: 需要元数据库（PostgreSQL）",
    "acceptance: 需要完整演示环境（StarRocks、维表库、元数据库、Valkey），会重置演示库",
    "engines: 需要更多引擎的演示库（scripts/demo.py up --engines）",
    "llm: 调用真实模型（需要 .env 中的 AVELIS_MODEL_API_KEY；会产生费用与数据外发）",
]
addopts = "-m 'not acceptance'"
# Starlette 建议改用 httpx2；httpx2 2.16.0（2026-10-21）发布不足两周，暂沿用 httpx 0.28.1（M4 复核）
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
required-version = ">=0.17"
line-length = 120
extend-exclude = ["src/avelis/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# 新代码按 120 列写；存量长行较多，统一格式化前不作为错误，避免与进行中的分支大面积冲突
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# pytest 夹具按参数名注入：从别的测试模块导入夹具后再作为参数出现，会被误报为重复定义
"tests/**" = ["F811"]
