name: 功能建议 / Feature request
description: 提出新功能或改进 / Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你遇到了什么问题，现在怎么绕过 / What problem do you have and how do you work around it today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法 / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案 / Alternatives considered
  - type: checkboxes
    id: neutral
    attributes:
      label: 业务中立 / Business neutrality
      options:
        - label: 这个功能不依赖某个具体行业或某张表结构（见 ADR 0010）/ The feature does not depend on a specific industry or schema (see ADR 0010)
